name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Номер сборки (versionCode)
        # RuStore и сам Android считают обновлением только сборку с большим versionCode, а у
        # Expo без настройки он всегда 1. Берём минуты с 01.01.2026 по UTC: число растёт само,
        # не зависит от номера запуска (в новом репозитории он начнётся с нуля) и с огромным
        # запасом влезает в int. Читает его app.config.js на шаге prebuild.
        run: |
          code=$(( ($(date -u +%s) - 1767225600) / 60 ))
          echo "LIVEBEAT_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionCode этой сборки: $code"

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean

      - name: Use stable signing key (so updates install over the old app)
        # prebuild --clean каждый раз генерирует СЛУЧАЙНЫЙ debug.keystore. От этого
        # меняется подпись APK, и новую сборку не поставить поверх старой без удаления
        # приложения (с потерей данных). Подменяем его ключом из репозитория, чтобы все
        # сборки подписывались одним ключом. Пока signing/debug.keystore не закоммичен,
        # шаг ничего не делает, и сборка не падает из-за того, что ключа ещё нет.
        run: |
          if [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore android/app/debug.keystore
            echo "Applied committed signing key -> stable signature."
          else
            echo "No committed keystore; using prebuild key (signature not stable)."
          fi

      - name: Build dev-client APK (needs Metro / expo start)
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Build standalone APK (JS bundled, runs without a PC)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Подписать standalone APK релизным ключом (если заданы секреты)
        # Ключ лежит в секретах репозитория, а не в коде. Секретов нет: шаг ничего не меняет,
        # APK остаётся с debug-подписью, как раньше. Ключ задан, а чего-то не хватает или
        # подпись не вышла: шаг падает, и сборка не доходит до загрузки артефактов.
        # Логика и проверки в scripts/sign-release-apk.sh, как завести ключ в plans/rustore.md.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash scripts/sign-release-apk.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload dev-client APK
        uses: actions/upload-artifact@v4
        with:
          name: livebeat-devclient-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: livebeat-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
